[package]
name = "monomixs/droidwright"
version = "1.2.0"
description = "Droidwright web app"

[passthrough-environment-variables]

[[module]]
name = "static-server"
source = "wasmer/static-website-server"

[[command]]
name = "script"
module = "static-server"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["."]
